{% extends "base.html" %}
{% block content %}
  <h2>Sign in</h2>
  {% if form.errors %}
    <p class="error">Your username and password didn't match. Please try again.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
